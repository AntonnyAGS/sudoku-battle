packages:
  - apps/*
  - libs/**/*
  - infra
allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  nx: true
  protobufjs: false
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nx/devkit@23.3.0'
  - '@nx/eslint-plugin@23.3.0'
  - '@nx/js@23.3.0'
  - '@nx/nx-darwin-arm64@23.3.0'
  - '@nx/nx-darwin-x64@23.3.0'
  - '@nx/nx-freebsd-x64@23.3.0'
  - '@nx/nx-linux-arm-gnueabihf@23.3.0'
  - '@nx/nx-linux-arm64-gnu@23.3.0'
  - '@nx/nx-linux-arm64-musl@23.3.0'
  - '@nx/nx-linux-x64-gnu@23.3.0'
  - '@nx/nx-linux-x64-musl@23.3.0'
  - '@nx/nx-win32-arm64-msvc@23.3.0'
  - '@nx/nx-win32-x64-msvc@23.3.0'
  - '@nx/workspace@23.3.0'
  - '@pulumi/pulumi@3.268.0'
  - nx@23.3.0
verifyDepsBeforeRun: false
saveExact: true
engineStrict: true
# Patch development-tooling advisories while preserving undici major versions.
overrides:
  'undici@>=6 <6.28.1': 6.28.1
  'undici@>=7 <7.29.1': 7.29.1
  'esbuild@>=0.27 <0.28.1': 0.28.1
